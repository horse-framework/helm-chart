{{- if and .Values.websocket.ingress (ne (int .Values.server.websocketPort) 0) }}
{{- $releaseName := .Release.Name }}
{{- $host := default .Values.jockey.ingressHost .Values.websocket.ingressHost }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $releaseName }}-ingress
  namespace: {{ include "horse.namespace" $ | quote }}
  labels:
    app: {{ $releaseName }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ $releaseName }}{{ $host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $releaseName }}
                port:
                  name: websocket

{{- range $i, $e := until (int .Values.cluster.replica) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $releaseName }}-{{ $i }}-ingress
  namespace: {{ include "horse.namespace" $ | quote }}
  labels:
    app: {{ $releaseName }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ $releaseName }}-{{ $i }}{{ $host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $releaseName }}-{{ $i }}
                port:
                  name: websocket

{{- end }}
{{- end }}

