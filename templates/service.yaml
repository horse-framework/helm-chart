{{- $releaseName := .Release.Name }}

apiVersion: v1
kind: Service
metadata:
  name: {{ $releaseName }}
  namespace: {{ include "horse.namespace" . | quote }}
spec:
  type: ClusterIP
  selector:
    app: {{ $releaseName }}
  ports:
    {{- include "horse.servicePorts" (dict "root" . "perPod" false) | nindent 4 }}
{{- range $i, $e := until (int .Values.cluster.replica) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $releaseName }}-{{ $i }}
  namespace: {{ include "horse.namespace" $ | quote }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    statefulset.kubernetes.io/pod-name: {{ $releaseName }}-{{ $i }}
  ports:
    {{- include "horse.servicePorts" (dict "root" $ "perPod" true) | nindent 4 }}
    - protocol: TCP
      name: horse-node
      port: 2628
      targetPort: horse-node
{{- end }}
