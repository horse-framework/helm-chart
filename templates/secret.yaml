{{- $releaseName := .Release.Name }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $releaseName }}-secret
  namespace: {{ include "horse.namespace" . | quote }}
stringData:
  HORSE_JOCKEY_USERNAME: {{ .Values.jockey.username | quote }}
  HORSE_JOCKEY_PASSWORD: {{ .Values.jockey.password | quote }}
  HORSE_CLUSTER_SECRET: {{ .Values.cluster.sharedSecret | quote }}
