{{- if and .Values.jockey.enabled .Values.jockey.ingress }}

{{- $releaseName := .Release.Name }}
{{- $host := .Values.jockey.ingressHost }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $releaseName }}-jockey-ingress
  namespace: {{ include "horse.namespace" $ | quote }}
  labels:
    app: {{ $releaseName }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ $releaseName }}-jockey{{ $host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $releaseName }}
                port:
                  name: horse-jockey

---

{{- range $i, $e := until (int .Values.cluster.replica) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $releaseName }}-jockey-{{ $i }}-ingress
  namespace: {{ include "horse.namespace" $ | quote }}
  labels:
    app: {{ $releaseName }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ $releaseName }}-jockey-{{ $i }}{{ $host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $releaseName }}-{{ $i }}
                port:
                  name: horse-jockey
---
{{- end }}

{{- end }}
