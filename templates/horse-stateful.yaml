{{ $releaseName := .Release.Name }}
{{ $replicaCount := int .Values.cluster.replica }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $releaseName }}
  namespace: {{ include "horse.namespace" . | quote }}
spec:
  replicas: {{ .Values.cluster.replica }}
  serviceName: {{ include "horse.headlessName" . }}
  selector:
    matchLabels:
      app: {{ $releaseName }}
  updateStrategy:
    {{- if .Values.deployment.rollingUpdate }}
    type: RollingUpdate
    rollingUpdate:
      partition: 0
    {{- else }}
    type: OnDelete
    {{- end }}
  template:
    metadata:
      {{- if .Values.deployment.restartOnConfigChange }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/horse-config.yaml") . | sha256sum | quote }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
      {{- end }}
      labels:
        app: {{ $releaseName }}
    spec:
      terminationGracePeriodSeconds: 5
      {{- if .Values.deployment.nodeAffinity }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - {{ $releaseName }}
      {{- end }}
      containers:
        - name: {{ $releaseName }}-container
          image: {{ include "horse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: HORSE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Kubernetes expands the preceding variable at container startup.
            # Horse compares HOSTNAME with peer names to exclude its own node.
            - name: HOSTNAME
              value: {{ printf "$(HORSE_POD_NAME).%s" (include "horse.podDnsSuffix" .) | quote }}
            {{- if ne $replicaCount 1 }}
            - name: HORSE_CLUSTER_TYPE
              value: {{ .Values.cluster.clusterType | quote }}
            - name: HORSE_HOSTNAME
              value: {{ printf "%s-INDEX.%s" $releaseName (include "horse.podDnsSuffix" .) | quote }}
            - name: HORSE_HOST_COUNT
              value: "{{ .Values.cluster.replica }}"
            - name: HORSE_HOST_START_INDEX
              value: "0"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $releaseName }}-config
            - secretRef:
                name: {{ $releaseName }}-secret
          ports:
            - name: horse-messaging
              containerPort: 2626
            - name: horse-node
              containerPort: 2628
            {{- if .Values.jockey.enabled }}
            - name: horse-jockey
              containerPort: 2627
            {{- end }}
            {{- if ne (int .Values.server.websocketPort) 0 }}
            - name: websocket
              containerPort: 2680
            {{- end }}
          volumeMounts:
            - name: {{ $releaseName }}-storage
              mountPath: {{ include "horse.mountPath" . | quote }}
  volumeClaimTemplates:
  - metadata:
      name: {{ $releaseName }}-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      volumeMode: Filesystem
      resources:
        requests:
          storage: {{ .Values.mount.storage }}
